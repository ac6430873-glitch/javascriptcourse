<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="styles/12rock-paper-scissors copy.css">
  </head>

  <body>

    <p style="
      color: white;
      font-size: 30px;
      font-weight: bold;
    ">
      Rock Paper Scissors
    </p>

    <button onclick="playGame('rock');" class="rps js-rock-button">
      <img src="rock-emoji.png" class="i1">
    </button>

    <button onclick="playGame('paper');" class="rps js-paper-button">
      <img src="paper-emoji.png" class="i1">
    </button>

    <button onclick="playGame('scissors');" class="rps js-scissors-button">
      <img src="scissors-emoji.png" class="i1">
    </button>

    <p class="js-result" style="color: white;"></p>

    <p class="js-moves" style="color: white;">
      Make a move!
    </p>

    <p class="js-score" style="
      color: white;
      margin-top: 60px;
    "></p>

    <button onclick="resetScore();" class="reset">
      Reset Score
    </button>

    <button onclick="autoPlay();" class="auto-play">
      Auto Play
    </button>

    <script src="./scripts/12-rock-paper-scissors copy.js"></script>

  </body>
</html>
